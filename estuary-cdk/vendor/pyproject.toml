[project]
name = "estuary-cdk-airbyte-shim"
version = "0.2.0"
description = "Vendored Airbyte CDK subset backing estuary_cdk.shim_airbyte_cdk"
authors = [
    { name = "Joseph Shearer", email = "joseph@estuary.dev" },
    { name = "Johnny Graettinger", email = "johnny@estuary.dev" },
]
# Matches estuary-cdk's floor: this is only ever installed alongside it.
requires-python = ">=3.11,<4.0"
# Leaf dependencies of the vendored Airbyte CDK subset. See README.md.
#
# These are the fork's own constraints, no longer `airbyte-cdk` 0.52.10's: the major
# bounds are there because the fork is never re-synced upstream, so a breaking major
# has to be absorbed by editing this tree by hand.
dependencies = [
    "backoff",
    "dpath>=2.1,<3.0",
    "jsonref>=1.1,<2.0",
    "jsonschema>=4,<5",
    "pendulum>=3,<4",
    "pydantic>=2.12,<3",
    "PyYAML>=6.0.1",
    "requests",
    "requests-cache",
]

# `ignore-vcs` is required: the repo .gitignore carries `vendor` for `go mod
# vendor` output, with an `!estuary-cdk/vendor` negation, and hatchling reads
# that file relative to THIS directory, where neither pattern's path matches --
# so the vendored tree would be silently excluded from the wheel and from the
# editable install's search path.
[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["airbyte_cdk", "airbyte_protocol"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

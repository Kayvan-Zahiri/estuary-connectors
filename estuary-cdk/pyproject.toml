[project]
name = "estuary_cdk"
version = "0.2.0"
description = "Estuary Connector Development Kit"
authors = [
    { name = "Joseph Shearer", email = "joseph@estuary.dev" },
    { name = "Johnny Graettinger", email = "johnny@estuary.dev" },
]
# The CDK is consumed outside this workspace -- source-netsuite lives in its
# own repository, pins estuary-cdk, and runs on 3.11 -- so this floor is what
# those consumers see, not what the workspace resolves to. Tested on 3.11,
# 3.12, 3.13 and 3.14; see .github/workflows/python.yaml. The ceiling is
# deliberately a major: too low a floor silently drops a consumer, but too low
# a ceiling blocks one outright, with no opt-out, the day that release ships.
requires-python = ">=3.11,<4.0"
dependencies = [
    "aiocsv>=1.3.2,<2.0.0",
    "aiodns>=4.0.4,<5.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "orjson>=3.11.6,<4.0.0",
    # 2.12 is the floor because shim_airbyte_cdk's model_json_schema
    # override forwards `union_format`, which super() only accepts from
    # 2.12 on. Lowering this makes the shim raise TypeError on spec.
    "pydantic>=2.12,<3",
    "xxhash>=4.0.2,<5.0.0",
    "ijson>=3.3.0,<4.0.0",
    "pycron>=3.1.2,<4.0.0",
    "stream-unzip==0.0.101",
    "typing-extensions>=4.13,<5.0",
    "google-auth[requests]>=2.40.3",
]

[project.urls]
homepage = "https://github.com/estuary/connectors/tree/main/estuary-cdk"

# The vendored Airbyte fork is its own distribution, built from `vendor/`.
# See vendor/README.md. Only `estuary_cdk.shim_airbyte_cdk` imports it, and
# only the connectors that still run on the shim ask for this extra.
#
# It is deliberately NOT published alongside the wheel that `main` uploads to
# the `cdk-dev` release: consumers outside this repository want the pure CDK
# and never the shim, so asking for this extra out there fails to resolve
# rather than quietly pulling in a fork of someone else's CDK.
[project.optional-dependencies]
airbyte-shim = ["estuary-cdk-airbyte-shim"]

[tool.uv.sources]
estuary-cdk-airbyte-shim = { workspace = true }

# The published wheel carries `estuary_cdk` alone. `ignore-vcs` is required:
# the repo .gitignore carries `vendor` for `go mod vendor` output, with an
# `!estuary-cdk/vendor` negation, and hatchling reads that file relative to
# THIS directory, where the negation's path no longer matches -- so a tree
# under `vendor/` would be silently excluded from a build rooted here.
[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["estuary_cdk"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
